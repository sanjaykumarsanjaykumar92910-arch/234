<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Light & Lens Virtual Laboratory</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
body{background:#aaa6d0;color:#111}
#app{width:100vw;height:100vh;position:relative;overflow:hidden}
#stage{position:absolute;inset:0 0 172px 0;background:#aaa6d0}
canvas{width:100%;height:100%;display:block}

.panel{position:absolute;background:#f2f2f2;border:2px solid #777;border-radius:10px;box-shadow:0 1px 2px #5556}
#env{right:22px;top:24px;width:315px;height:158px;padding:14px 20px}
#laserPanel{right:22px;top:207px;width:315px;height:219px;padding:10px 14px}
#bottom{left:18px;right:18px;bottom:18px;height:154px;padding:8px 10px;display:flex;align-items:stretch}
#lensChoices{width:560px;display:flex;align-items:center;gap:13px;padding:6px 12px;border-right:2px solid #999}
.lensBtn{width:92px;height:112px;border:0;background:transparent;cursor:pointer;position:relative}
.lensBtn svg{width:92px;height:86px;display:block}
.lensBtn:hover{filter:brightness(.95)}
.lensBtn.active{outline:3px solid #2b9ac2;border-radius:7px;background:#eaf7fb}
.lensBtn span{font-size:11px;display:block;margin-top:1px}
#objectControls{flex:1;min-width:310px;padding:0 22px;position:relative}
.sectionTitle{font-size:18px;font-weight:bold;margin:2px 0 8px}
.select{height:30px;border:2px solid #777;border-radius:5px;background:white;font-size:16px;padding:0 8px}
.row{display:flex;align-items:center;gap:10px}
.sliderTitle{font-size:17px;margin:12px 0 5px}
.range{width:265px}
.marks{width:265px;display:flex;justify-content:space-between;font-size:13px}
#options{width:175px;border-left:2px solid #999;padding:10px 10px 0 14px}
.check{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:16px}
.check input{appearance:none;width:24px;height:24px;border:2px solid #222;border-radius:5px;background:#fff;cursor:pointer}
.check input:checked{background:#2b9ac2;box-shadow:inset 0 0 0 4px white}
#reset{position:absolute;right:24px;bottom:10px;width:62px;height:62px;border-radius:50%;border:2px solid #a56a00;background:#f59d20;color:#fff;font-size:35px;font-weight:bold;cursor:pointer;box-shadow:inset 0 2px 4px #fff7,0 2px 4px #555}
#reset:hover{filter:brightness(1.08)}

h3{margin:0 0 12px;font-size:18px}
.envRow{display:flex;align-items:center;gap:10px}
.envName{font-size:17px;font-weight:bold}
.smallLabel{font-size:17px;margin-top:14px}
.numbers{display:flex;justify-content:space-between;font-size:15px;margin:3px 0 2px}
.envRange{width:100%}
#envValue{font-weight:bold}
#laserModes{display:flex;gap:15px;margin-bottom:18px}
.mode{width:88px;height:72px;border:2px solid #aaa;border-radius:8px;background:#e8e8e8;cursor:pointer}
.mode.active{border:4px solid #2d9fc5;background:white}
.mode svg{width:100%;height:100%}
.waveRow{display:flex;justify-content:center;align-items:center;gap:8px}
.arrow{width:30px;height:29px;border:1px solid #777;border-radius:5px;background:#fff;font-size:20px;cursor:pointer}
#wavelength{width:96px;height:30px;border:2px solid #777;border-radius:5px;background:#fff;text-align:center;font-size:16px}
.spectrum{position:relative;height:32px;margin:9px 17px 0;border:2px solid #333;background:linear-gradient(90deg,#6f00a8 0%,#0000ff 16%,#00d9ff 33%,#00ff00 50%,#ffff00 67%,#ff8c00 83%,#ff0000 100%)}
.marker{position:absolute;top:-3px;width:4px;height:38px;background:#fff;border:1px solid #111;transform:translateX(-50%)}
.handle{position:absolute;top:32px;width:31px;height:25px;background:#ff1010;border:2px solid #222;border-radius:3px 3px 7px 7px;transform:translateX(-50%)}
.handle:before{content:"";position:absolute;left:8px;top:-11px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid #ff1010}

#readout{position:absolute;left:20px;top:18px;background:#ffffffdf;border:1px solid #777;border-radius:7px;padding:8px 12px;font-size:14px;line-height:1.45;min-width:235px}
#dragHint{position:absolute;left:20px;bottom:12px;background:#ffffffc9;padding:5px 9px;border-radius:5px;font-size:13px}

.laserDevice{position:absolute;width:164px;height:55px;transform-origin:50% 50%;cursor:grab;z-index:5}
.laserDevice:active{cursor:grabbing}
.laserBody{position:absolute;left:25px;top:5px;width:112px;height:45px;border:2px solid #333;border-radius:5px;background:linear-gradient(#fafafa,#8f8f8f 48%,#d8d8d8 54%,#777);box-shadow:inset 0 0 6px #fff}
.laserHead{position:absolute;left:0;top:15px;width:28px;height:25px;border:2px solid #555;border-radius:4px 0 0 4px;background:linear-gradient(#d6d6d6,#777)}
.laserTip{position:absolute;left:-14px;top:18px;width:17px;height:19px;border:2px solid #765a20;border-radius:3px;background:linear-gradient(#d6bd72,#9b7733)}
.laserButton{position:absolute;right:36px;top:11px;width:38px;height:38px;border-radius:50%;border:2px solid #b40000;background:#ff2020;box-shadow:inset 0 2px 5px #fff8;cursor:pointer;z-index:2}
.laserButton.off{background:#555;border-color:#333}
.laserBack{position:absolute;right:0;top:13px;width:21px;height:31px;border:2px solid #555;border-radius:0 4px 4px 0;background:#ddd}

.laserBeam{position:absolute;height:4px;transform-origin:0 50%;pointer-events:none;z-index:2;box-shadow:0 0 7px currentColor}
.laserBeam.off{display:none}

.lensObject{position:absolute;z-index:6;cursor:grab;transform:translate(-50%,-50%)}
.lensObject:active{cursor:grabbing}
.lensObject svg{display:block;overflow:visible}
.focusDot{position:absolute;width:9px;height:9px;border-radius:50%;background:#222;transform:translate(-50%,-50%);z-index:4}
.focusLabel{position:absolute;font-size:13px;font-weight:bold;transform:translate(-50%,0);z-index:4}

.ray{position:absolute;height:2px;transform-origin:0 50%;pointer-events:none;z-index:3}
.ray.dashed{background:repeating-linear-gradient(90deg,currentColor 0 7px,transparent 7px 13px)}
.normalLine{position:absolute;height:2px;background:#222;transform-origin:0 50%;pointer-events:none;z-index:3}
.protractor{position:absolute;width:180px;height:90px;border:2px solid #777;border-bottom:0;border-radius:180px 180px 0 0;background:#fff8;z-index:10;pointer-events:none}
.protractor:after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:90px;background:#555}

#tip{position:absolute;z-index:30;background:#222;color:#fff;padding:5px 8px;border-radius:4px;font-size:12px;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="sim"></canvas>
    <div id="readout">
      <b>Light & Lens Laboratory</b><br>
      Lens: <span id="lensReadout">Biconvex</span><br>
      Focal length: <span id="fReadout">+160 px</span><br>
      Medium: <span id="mediumReadout">Air</span> &nbsp; n=<span id="nReadout">1.00</span>
    </div>
    <div id="dragHint">Drag the laser or lens • Click the red laser button to switch ON/OFF</div>
  </div>

  <div id="env" class="panel">
    <h3>Environment</h3>
    <div class="envRow">
      <select id="medium" class="select">
        <option value="1">Air</option>
        <option value="1.333">Water</option>
        <option value="1.5">Glass</option>
        <option value="2.42">Diamond</option>
        <option value="1.15">Custom</option>
      </select>
    </div>
    <div class="smallLabel">Index of Refraction (n)</div>
    <div class="numbers"><span>Air</span><span>Water</span><span>Glass</span></div>
    <input id="envSlider" class="envRange" type="range" min="1" max="2.42" step=".001" value="1">
    <div style="text-align:right;font-size:14px">n = <span id="envValue">1.000</span></div>
  </div>

  <div id="laserPanel" class="panel">
    <div id="laserModes">
      <button class="mode active" data-count="1" title="One laser">
        <svg viewBox="0 0 88 72"><rect x="12" y="18" width="38" height="34" rx="3" fill="#ddd" stroke="#555"/><rect x="47" y="25" width="10" height="20" fill="#aaa" stroke="#555"/><line x1="58" y1="36" x2="81" y2="36" stroke="red" stroke-width="3"/></svg>
      </button>
      <button class="mode" data-count="2" title="Two lasers">
        <svg viewBox="0 0 88 72"><rect x="12" y="18" width="38" height="34" rx="3" fill="#ddd" stroke="#555"/><line x1="50" y1="28" x2="81" y2="28" stroke="red" stroke-width="3"/><line x1="50" y1="36" x2="81" y2="36" stroke="red" stroke-width="3"/><line x1="50" y1="44" x2="81" y2="44" stroke="red" stroke-width="3"/></svg>
      </button>
      <button class="mode" data-count="4" title="Four lasers">
        <svg viewBox="0 0 88 72"><rect x="12" y="18" width="38" height="34" rx="3" fill="#ddd" stroke="#555"/><line x1="50" y1="23" x2="81" y2="23" stroke="#fff" stroke-width="2"/><line x1="50" y1="31" x2="81" y2="31" stroke="#fff" stroke-width="2"/><line x1="50" y1="39" x2="81" y2="39" stroke="#fff" stroke-width="2"/><line x1="50" y1="47" x2="81" y2="47" stroke="#fff" stroke-width="2"/></svg>
      </button>
    </div>
    <div class="waveRow">
      <button class="arrow" id="waveDown">◀</button>
      <input id="wavelength" value="650 nm" readonly>
      <button class="arrow" id="waveUp">▶</button>
    </div>
    <div class="spectrum" id="spectrum"><div class="marker" id="marker"></div><div class="handle" id="handle"></div></div>
  </div>

  <div id="bottom" class="panel">
    <div id="lensChoices"></div>

    <div id="objectControls">
      <div class="sectionTitle">Objects</div>
      <div class="row">
        <select id="lensSelect" class="select"></select>
        <span style="font-size:23px">▲</span>
      </div>
      <div class="sliderTitle">Index of Refraction (n)</div>
      <div class="marks"><span>Air</span><span>Water</span><span>Glass</span></div>
      <input id="lensN" class="range" type="range" min="1" max="2.42" step=".001" value="1.5">
      <div style="font-size:13px">Lens n = <b id="lensNValue">1.500</b></div>
    </div>

    <div id="options">
      <label class="check"><input id="reflection" type="checkbox">Reflections</label>
      <label class="check"><input id="normal" type="checkbox">Normal</label>
      <label class="check"><input id="protractor" type="checkbox">Protractor</label>
    </div>

    <button id="reset" title="Reset">↻</button>
  </div>
  <div id="tip"></div>
</div>

<script>
const canvas=document.getElementById("sim"),ctx=canvas.getContext("2d");
const stage=document.getElementById("stage");
let W=0,H=0,scaleX=1,scaleY=1;
const state={
  wavelength:650, medium:1, lensN:1.5,
  lens:"biconvex", laserCount:1,
  showReflection:false,showNormal:false,showProtractor:false,
  lensX:.53,lensY:.53, lasers:[]
};
const lensData={
 biconvex:{name:"Biconvex",f:160,type:"Converging",use:"Magnifying glass / camera"},
 planoconvex:{name:"Plano-convex",f:185,type:"Converging",use:"Collimators / optical instruments"},
 meniscusP:{name:"Positive meniscus",f:205,type:"Converging",use:"Eyepieces / optical systems"},
 biconcave:{name:"Biconcave",f:-160,type:"Diverging",use:"Beam expanders / myopia correction"},
 planoconcave:{name:"Plano-concave",f:-185,type:"Diverging",use:"Laser beam shaping"},
 meniscusN:{name:"Negative meniscus",f:-205,type:"Diverging",use:"Optical correction"},
 cylindrical:{name:"Cylindrical",f:175,type:"Converging in one axis",use:"Astigmatism / line beam"}
};
const lensKeys=Object.keys(lensData);
const lensChoices=document.getElementById("lensChoices");
const lensSelect=document.getElementById("lensSelect");

function resize(){
  W=stage.clientWidth; H=stage.clientHeight;
  const dpr=devicePixelRatio||1; canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  scaleX=W/1200;scaleY=H/700;
  draw();
}
window.addEventListener("resize",resize);

function lensSVG(key){
  const common=`<svg viewBox="0 0 92 86" aria-hidden="true">
  <line x1="8" y1="69" x2="84" y2="69" stroke="#999" stroke-width="1"/>
  <line x1="46" y1="8" x2="46" y2="72" stroke="#ddd" stroke-width="1"/>`;
  let shape="";
  if(key==="biconvex") shape=`<path d="M31 10 Q14 43 31 69 L61 69 Q78 43 61 10 Z" fill="#f5f5f5" stroke="#888"/>`;
  if(key==="planoconvex") shape=`<path d="M28 10 L28 69 L62 69 Q79 43 62 10 Z" fill="#f5f5f5" stroke="#888"/>`;
  if(key==="meniscusP") shape=`<path d="M27 10 Q12 43 27 69 Q66 65 68 43 Q66 16 27 10 Z" fill="#f5f5f5" stroke="#888"/>`;
  if(key==="biconcave") shape=`<path d="M27 10 Q42 43 27 69 L65 69 Q50 43 65 10 Z" fill="#f5f5f5" stroke="#888"/>`;
  if(key==="planoconcave") shape=`<path d="M27 10 Q42 43 27 69 L65 69 L65 10 Z" fill="#f5f5f5" stroke="#888"/>`;
  if(key==="meniscusN") shape=`<path d="M27 10 Q66 16 68 43 Q66 65 27 69 Q42 43 27 10 Z" fill="#f5f5f5" stroke="#888"/>`;
  if(key==="cylindrical") shape=`<rect x="30" y="10" width="32" height="59" rx="16" fill="#f5f5f5" stroke="#888"/>`;
  return common+shape+"</svg>";
}
lensKeys.forEach(k=>{
  const b=document.createElement("button");b.className="lensBtn";b.dataset.lens=k;
  b.innerHTML=lensSVG(k)+`<span>${lensData[k].name}</span>`;
  b.onclick=()=>setLens(k);lensChoices.appendChild(b);
  const o=document.createElement("option");o.value=k;o.textContent=lensData[k].name;lensSelect.appendChild(o);
});
function setLens(k){
 state.lens=k;lensSelect.value=k;
 document.querySelectorAll(".lensBtn").forEach(x=>x.classList.toggle("active",x.dataset.lens===k));
 updateReadout();draw();
}
lensSelect.onchange=e=>setLens(e.target.value);

function colorForWavelength(w){
 let r=0,g=0,b=0;
 if(w>=380&&w<440){r=-(w-440)/60;g=0;b=1}
 else if(w<490){r=0;g=(w-440)/50;b=1}
 else if(w<510){r=0;g=1;b=-(w-510)/20}
 else if(w<580){r=(w-510)/70;g=1;b=0}
 else if(w<645){r=1;g=-(w-645)/65;b=0}
 else{r=1;g=0;b=0}
 const f=w<420?.35:w<645?1:.35;
 return `rgb(${Math.round(r*255*f)},${Math.round(g*255*f)},${Math.round(b*255*f)})`;
}
function updateSpectrum(){
 const p=(state.wavelength-380)/(700-380)*100;
 marker.style.left=p+"%";handle.style.left=p+"%";
 wavelength.value=state.wavelength+" nm";
 const c=colorForWavelength(state.wavelength);
 document.querySelectorAll(".laserButton").forEach(x=>x.style.background=x.classList.contains("off")?"#555":c);
}
function makeLasers(){
 state.lasers=[];
 const positions=state.laserCount===1?[.52]:state.laserCount===2?[.46,.58]:[.40,.47,.54,.61];
 positions.forEach((y,i)=>state.lasers.push({x:.15,y,angle:0,on:true}));
 updateLaserDOM();draw();
}
function updateLaserDOM(){
 document.querySelectorAll(".laserDevice").forEach(x=>x.remove());
 state.lasers.forEach((l,i)=>{
  const d=document.createElement("div");d.className="laserDevice";d.dataset.i=i;
  d.innerHTML=`<div class="laserTip"></div><div class="laserHead"></div><div class="laserBody"></div><button class="laserButton"></button><div class="laserBack"></div>`;
  const btn=d.querySelector(".laserButton");
  btn.onclick=e=>{e.stopPropagation();l.on=!l.on;btn.classList.toggle("off",!l.on);updateSpectrum();draw()};
  d.onpointerdown=e=>startDrag(e,"laser",i);
  stage.appendChild(d);
  l.dom=d;l.btn=btn;
 });
 updateSpectrum();positionLasers();
}
function positionLasers(){
 state.lasers.forEach(l=>{
  const d=l.dom;
  d.style.left=(l.x*W-82)+"px";d.style.top=(l.y*H-27)+"px";
  d.style.transform=`rotate(${l.angle}rad)`;
 });
}
function startDrag(e,type,index){
 e.preventDefault(); const startX=e.clientX,startY=e.clientY;
 const item=type==="laser"?state.lasers[index]:state;
 const sx=type==="laser"?item.x:item.lensX,sy=type==="laser"?item.y:item.lensY;
 function move(ev){
   const dx=(ev.clientX-startX)/W,dy=(ev.clientY-startY)/H;
   if(type==="laser"){item.x=Math.max(.04,Math.min(.8,sx+dx));item.y=Math.max(.05,Math.min(.95,sy+dy));positionLasers()}
   else{state.lensX=Math.max(.20,Math.min(.82,sx+dx));state.lensY=Math.max(.15,Math.min(.85,sy+dy))}
   draw();
 }
 function up(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up)}
 window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
}
function lensCenter(){return {x:state.lensX*W,y:state.lensY*H}}
function opticalF(){
 const d=lensData[state.lens], n=state.lensN/state.medium;
 const base=Math.abs(d.f);
 // A simple thin-lens material scaling: stronger index contrast => shorter focal length.
 const f=base*(.50/Math.max(.08,Math.abs(n-1)));
 return Math.max(65,Math.min(650,f))*(d.f<0?-1:1);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // subtle simulation grid
 ctx.save();ctx.strokeStyle="#ffffff20";ctx.lineWidth=1;
 const gx=45,gy=45;
 for(let x=0;x<W;x+=gx){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=gy){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.restore();

 const lc=lensCenter(), f=opticalF();
 drawAxis(lc);
 drawRays(lc,f);
 if(state.showReflection) drawReflections(lc);
 if(state.showNormal) drawNormal(lc);
 if(state.showProtractor) drawProtractor(lc);
 drawLens(lc);
 positionLasers();
 updateReadout();
}
function drawAxis(lc){
 ctx.save();ctx.strokeStyle="#555";ctx.lineWidth=1.2;ctx.setLineDash([8,7]);
 ctx.beginPath();ctx.moveTo(0,lc.y);ctx.lineTo(W,lc.y);ctx.stroke();ctx.restore();
}
function drawRays(lc,f){
 const c=colorForWavelength(state.wavelength);
 state.lasers.forEach(l=>{
   if(!l.on)return;
   const sx=l.x*W+72, sy=l.y*H;
   const dx=lc.x-sx;
   const dy=lc.y-sy;
   const slope=dy/dx;
   // Ray reaches lens plane.
   const hitY=sy+slope*(lc.x-sx);
   rayLine(sx,sy,lc.x,hitY,c);
   if(Math.abs(hitY-lc.y)<4){
     if(f>0){
       const fx=lc.x+f;
       rayLine(lc.x,hitY,fx,lc.y,c);
       rayLine(fx,lc.y,W,lc.y,c);
     }else{
       const backX=lc.x+f;
       rayLine(lc.x,hitY,W,hitY+(W-lc.x)*(0),c);
       // virtual continuation
       dashedLine(backX,lc.y,lc.x,hitY,c);
     }
   }else{
     // Parallel-ish refraction approximation using thin-lens angular change.
     const yRel=hitY-lc.y;
     const theta2=dy/dx - yRel/f;
     const endX=W;
     rayLine(lc.x,hitY,endX,hitY+theta2*(endX-lc.x),c);
   }
 });
}
function rayLine(x1,y1,x2,y2,c){
 ctx.save();ctx.strokeStyle=c;ctx.lineWidth=3;ctx.shadowBlur=8;ctx.shadowColor=c;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dashedLine(x1,y1,x2,y2,c){
 ctx.save();ctx.strokeStyle=c;ctx.globalAlpha=.55;ctx.lineWidth=2;ctx.setLineDash([7,7]);
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function drawReflections(lc){
 ctx.save();ctx.strokeStyle=colorForWavelength(state.wavelength);ctx.globalAlpha=.45;ctx.lineWidth=2;
 state.lasers.forEach(l=>{
  if(!l.on)return;
  const y=l.y*H;
  ctx.beginPath();ctx.moveTo(lc.x,y);ctx.lineTo(lc.x-120,y-35);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lc.x,y);ctx.lineTo(lc.x-120,y+35);ctx.stroke();
 });ctx.restore();
}
function drawNormal(lc){
 ctx.save();ctx.strokeStyle="#222";ctx.lineWidth=2;ctx.setLineDash([6,5]);
 ctx.beginPath();ctx.moveTo(lc.x,lc.y-90);ctx.lineTo(lc.x,lc.y+90);ctx.stroke();ctx.restore();
}
function drawProtractor(lc){
 ctx.save();ctx.strokeStyle="#777";ctx.fillStyle="#fff8";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(lc.x,lc.y,85,Math.PI,2*Math.PI);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(lc.x-85,lc.y);ctx.lineTo(lc.x+85,lc.y);ctx.stroke();
 for(let a=0;a<=180;a+=10){let r=a*Math.PI/180,x1=lc.x+75*Math.cos(r),y1=lc.y-75*Math.sin(r),x2=lc.x+85*Math.cos(r),y2=lc.y-85*Math.sin(r);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
 ctx.restore();
}
function drawLens(lc){
 const k=state.lens, w=58,h=155;
 ctx.save();ctx.translate(lc.x,lc.y);
 ctx.shadowColor="#5558";ctx.shadowBlur=7;
 const grad=ctx.createLinearGradient(-w/2,0,w/2,0);grad.addColorStop(0,"#ffffffcc");grad.addColorStop(.5,"#bfe8f1aa");grad.addColorStop(1,"#ffffffcc");
 ctx.fillStyle=grad;ctx.strokeStyle="#4e7077";ctx.lineWidth=2;
 ctx.beginPath();
 if(k==="biconvex"){ctx.moveTo(-w/2,-h/2);ctx.quadraticCurveTo(-w/2-20,0,-w/2,h/2);ctx.lineTo(w/2,h/2);ctx.quadraticCurveTo(w/2+20,0,w/2,-h/2);ctx.closePath()}
 else if(k==="planoconvex"){ctx.moveTo(-w/2,-h/2);ctx.lineTo(-w/2,h/2);ctx.lineTo(w/2,h/2);ctx.quadraticCurveTo(w/2+24,0,w/2,-h/2);ctx.closePath()}
 else if(k==="meniscusP"){ctx.moveTo(-w/2,-h/2);ctx.quadraticCurveTo(-w/2-20,0,-w/2,h/2);ctx.quadraticCurveTo(w/2+20,h/2,w/2,-h/2);ctx.closePath()}
 else if(k==="biconcave"){ctx.moveTo(-w/2,-h/2);ctx.quadraticCurveTo(-w/2+20,0,-w/2,h/2);ctx.lineTo(w/2,h/2);ctx.quadraticCurveTo(w/2-20,0,w/2,-h/2);ctx.closePath()}
 else if(k==="planoconcave"){ctx.moveTo(-w/2,-h/2);ctx.quadraticCurveTo(-w/2+20,0,-w/2,h/2);ctx.lineTo(w/2,h/2);ctx.lineTo(w/2,-h/2);ctx.closePath()}
 else if(k==="meniscusN"){ctx.moveTo(-w/2,-h/2);ctx.quadraticCurveTo(w/2+20,0,w/2,h/2);ctx.quadraticCurveTo(-w/2+20,0,-w/2,-h/2);ctx.closePath()}
 else {ctx.moveTo(-w/2,-h/2);ctx.quadraticCurveTo(0,-h/2+30,w/2,-h/2);ctx.lineTo(w/2,h/2);ctx.quadraticCurveTo(0,h/2-30,-w/2,h/2);ctx.closePath()}
 ctx.fill();ctx.stroke();ctx.restore();

 const f=Math.abs(opticalF());
 const left=lc.x-f,right=lc.x+f;
 if(left>0){dot(left,lc.y);label("F",left,lc.y+10)}
 if(right<W){dot(right,lc.y);label("F′",right,lc.y+10)}
}
function dot(x,y){ctx.save();ctx.fillStyle="#222";ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.restore()}
function label(t,x,y){ctx.save();ctx.fillStyle="#222";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText(t,x,y);ctx.restore()}
function updateReadout(){
 const d=lensData[state.lens],f=opticalF();
 lensReadout.textContent=d.name+" ("+d.type+")";
 fReadout.textContent=(d.f>0?"+":"−")+Math.round(Math.abs(f))+" px";
 mediumReadout.textContent=document.getElementById("medium").selectedOptions[0].text;
 nReadout.textContent=Number(state.medium).toFixed(2);
}
document.getElementById("medium").onchange=e=>{
 state.medium=+e.target.value;envSlider.value=state.medium;envValue.textContent=state.medium.toFixed(3);draw();
};
const envSlider=document.getElementById("envSlider");
envSlider.oninput=e=>{state.medium=+e.target.value;envValue.textContent=state.medium.toFixed(3);document.getElementById("medium").value=["1","1.333","1.5","2.42","1.15"].includes(e.target.value)?e.target.value:"1.15";draw()};
const lensN=document.getElementById("lensN");
lensN.oninput=e=>{state.lensN=+e.target.value;lensNValue.textContent=state.lensN.toFixed(3);draw()};
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 state.laserCount=+b.dataset.count;makeLasers();
});
function changeWave(v){state.wavelength=Math.max(380,Math.min(700,state.wavelength+v));updateSpectrum();draw()}
waveDown.onclick=()=>changeWave(-10);waveUp.onclick=()=>changeWave(10);
document.getElementById("reflection").onchange=e=>{state.showReflection=e.target.checked;draw()};
document.getElementById("normal").onchange=e=>{state.showNormal=e.target.checked;draw()};
document.getElementById("protractor").onchange=e=>{state.showProtractor=e.target.checked;draw()};
document.getElementById("reset").onclick=()=>{
 state.wavelength=650;state.medium=1;state.lensN=1.5;state.lens="biconvex";state.lensX=.53;state.lensY=.53;state.laserCount=1;
 medium.value="1";envSlider.value=1;envValue.textContent="1.000";lensN.value=1.5;lensNValue.textContent="1.500";
 reflection.checked=normal.checked=protractor.checked=false;
 document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));document.querySelector(".mode").classList.add("active");
 setLens("biconvex");makeLasers();
};
stage.addEventListener("pointerdown",e=>{
 if(e.target!==canvas)return;
 const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const lc=lensCenter();
 if(Math.hypot(x-lc.x,y-lc.y)<80)startDrag(e,"lens",0);
});
resize();setLens("biconvex");makeLasers();
</script>
</body>
</html>
